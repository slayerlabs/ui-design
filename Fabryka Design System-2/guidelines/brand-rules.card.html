<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--paper)}.row{display:flex;gap:0}.sw{flex:1;height:64px;display:flex;align-items:flex-end;padding:6px;font-family:var(--font-mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase}.k{font-family:var(--font-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--grey-dark)}</style></head><body><div style="display:flex;flex-direction:column;gap:12px">
<div><div style="border-top:var(--border-heavy) solid var(--rule-strong)"></div><div class="k" style="margin-top:4px">3px — section openers</div></div>
<div><div style="border-top:var(--border-step)"></div><div class="k" style="margin-top:4px">2px — current-page indicator, process steps</div></div>
<div><div style="border-top:var(--border-chip)"></div><div class="k" style="margin-top:4px">1.5px — plate frames, table heads</div></div>
<div><div style="border-top:var(--border-soft)"></div><div class="k" style="margin-top:4px">1px @ 22% — panels, fields</div></div>
<div><div style="border-top:var(--border-faint)"></div><div class="k" style="margin-top:4px">1px @ 11% — row separators</div></div>
</div>
<div class="k" style="margin-top:12px;color:var(--text-accent)">Radius: 0 for panels; 4px actions, 6px header controls, 8px floating panels. Circles only for status LEDs.</div></body></html>
