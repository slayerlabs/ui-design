<!-- @dsCard group="Colors" viewport="700x160" name="Status Signals" subtitle="Green, amber and grey exist only as machine state" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--paper)}.row{display:flex;gap:0}.sw{flex:1;height:64px;display:flex;align-items:flex-end;padding:6px;font-family:var(--font-mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase}.k{font-family:var(--font-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--grey-dark)}</style></head><body><div style="display:flex;gap:28px;align-items:center;font-family:var(--font-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase">
<span style="display:flex;align-items:center;gap:7px"><span style="width:9px;height:9px;border-radius:50%;background:#1E9E4A"></span>Live / pass</span>
<span style="display:flex;align-items:center;gap:7px"><span style="width:9px;height:9px;border-radius:50%;background:#C88A05"></span>Degraded</span>
<span style="display:flex;align-items:center;gap:7px"><span style="width:9px;height:9px;border-radius:50%;background:#E43D26"></span>Fail</span>
<span style="display:flex;align-items:center;gap:7px"><span style="width:9px;height:9px;border-radius:50%;background:#8C8C86"></span>Queued / offline</span>
</div>
<div class="row" style="margin-top:16px"><div class="sw" style="background:#1E9E4A;color:#fff;height:44px">#1E9E4A</div><div class="sw" style="background:#C88A05;color:#111;height:44px">#C88A05</div><div class="sw" style="background:#8C8C86;color:#111;height:44px">#8C8C86</div></div>
<div class="k" style="margin-top:10px">Green is never decorative — it may only report a real state</div></body></html>
