name: i18n

on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Dictionary drift + schema check
        run: node scripts/i18n-check.cjs
      - name: Red-green proof (fixtures)
        run: |
          if (cd scripts/fixtures/i18n/red && node ../../../../scripts/i18n-check.cjs); then
            echo "red fixture must fail"; exit 1
          fi
          cd scripts/fixtures/i18n/green && node ../../../../scripts/i18n-check.cjs